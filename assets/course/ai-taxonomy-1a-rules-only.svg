<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A rule-based approach to building an AI system</title>
  <desc id="desc">A full-slide diagram showing an expense claim passing through explicit policy rules to approval or review.</desc>
  <rect width="1600" height="900" fill="#fffdf5"/>
  <rect x="10" y="10" width="1580" height="880" fill="none" stroke="#172033" stroke-width="12"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#172033">
    <text x="64" y="72" fill="#6656d9" font-size="22" font-weight="900" letter-spacing="3">WHAT IS AI? / 02A</text>
    <text x="64" y="154" font-size="66" font-weight="900" letter-spacing="-2">APPROACH 1 · WRITE THE RULES</text>
    <text x="68" y="203" font-size="29" font-weight="700">People decide the logic before a new case arrives.</text>

    <rect x="64" y="252" width="1472" height="430" fill="#f4dc67" stroke="#172033" stroke-width="8"/>
    <text x="98" y="310" font-size="20" font-weight="900" letter-spacing="2">RULE-BASED EXPENSE REVIEW</text>
    <text x="98" y="372" font-size="42" font-weight="900">IF THE CLAIM MATCHES POLICY, APPROVE IT.</text>
    <text x="98" y="416" font-size="27" font-weight="750">Otherwise, send it to a person for review.</text>

    <rect x="112" y="482" width="250" height="112" fill="#fffdf5" stroke="#172033" stroke-width="6"/>
    <rect x="484" y="482" width="250" height="112" fill="#fffdf5" stroke="#172033" stroke-width="6"/>
    <rect x="856" y="482" width="250" height="112" fill="#8ff4d8" stroke="#172033" stroke-width="6"/>
    <rect x="1228" y="482" width="250" height="112" fill="#fffdf5" stroke="#172033" stroke-width="6"/>
    <text x="237" y="527" text-anchor="middle" font-size="22" font-weight="900">EXPENSE</text>
    <text x="237" y="560" text-anchor="middle" font-size="22" font-weight="900">CLAIM</text>
    <text x="609" y="527" text-anchor="middle" font-size="22" font-weight="900">EXPLICIT</text>
    <text x="609" y="560" text-anchor="middle" font-size="22" font-weight="900">POLICY RULES</text>
    <text x="981" y="527" text-anchor="middle" font-size="22" font-weight="900">PASS / FAIL</text>
    <text x="981" y="560" text-anchor="middle" font-size="22" font-weight="900">CHECK</text>
    <text x="1353" y="527" text-anchor="middle" font-size="22" font-weight="900">APPROVE /</text>
    <text x="1353" y="560" text-anchor="middle" font-size="22" font-weight="900">HUMAN REVIEW</text>

    <path d="M374 538 H468" fill="none" stroke="#172033" stroke-width="9"/>
    <path d="M454 522 L476 538 L454 554" fill="none" stroke="#172033" stroke-width="9"/>
    <path d="M746 538 H840" fill="none" stroke="#172033" stroke-width="9"/>
    <path d="M826 522 L848 538 L826 554" fill="none" stroke="#172033" stroke-width="9"/>
    <path d="M1118 538 H1212" fill="none" stroke="#172033" stroke-width="9"/>
    <path d="M1198 522 L1220 538 L1198 554" fill="none" stroke="#172033" stroke-width="9"/>

    <rect x="64" y="728" width="1472" height="108" fill="#172033"/>
    <text x="96" y="774" fill="#f4dc67" font-size="20" font-weight="900" letter-spacing="2">GOOD FIT</text>
    <text x="96" y="816" fill="#ffffff" font-size="27" font-weight="750">THE POLICY IS EXPLICIT, STABLE, AND EASY TO AUDIT.</text>
  </g>
</svg>
