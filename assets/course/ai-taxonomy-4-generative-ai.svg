<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Generative AI produces candidate outputs</title>
  <desc id="desc">A full-slide comparison between predictive outputs such as scores, labels, and forecasts and generative outputs such as text, images, code, audio, video, and plans.</desc>
  <rect width="1600" height="900" fill="#fffdf5"/>
  <rect x="10" y="10" width="1580" height="880" fill="none" stroke="#172033" stroke-width="12"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#172033">
    <text x="64" y="72" fill="#6656d9" font-size="22" font-weight="900" letter-spacing="3">WHAT IS AI? / 05</text>
    <text x="64" y="154" font-size="66" font-weight="900" letter-spacing="-2">GENERATIVE AI</text>
    <text x="68" y="203" font-size="29" font-weight="700">The output changes from a prediction about something to a candidate artifact.</text>

    <rect x="64" y="252" width="500" height="446" fill="#f4dc67" stroke="#172033" stroke-width="8"/>
    <text x="96" y="305" font-size="20" font-weight="900" letter-spacing="2">PREDICTIVE OUTPUT</text>
    <text x="96" y="370" font-size="45" font-weight="900">SCORE</text>
    <line x1="96" y1="389" x2="532" y2="389" stroke="#172033" stroke-width="4"/>
    <text x="96" y="458" font-size="45" font-weight="900">LABEL</text>
    <line x1="96" y1="477" x2="532" y2="477" stroke="#172033" stroke-width="4"/>
    <text x="96" y="546" font-size="45" font-weight="900">FORECAST</text>
    <text x="96" y="626" font-size="23" font-weight="750">Examples: churn risk, fraud flag,</text>
    <text x="96" y="658" font-size="23" font-weight="750">demand estimate.</text>

    <rect x="620" y="252" width="916" height="446" fill="#ffe2f1" stroke="#172033" stroke-width="8"/>
    <text x="652" y="305" fill="#ef2d8f" font-size="20" font-weight="900" letter-spacing="2">GENERATIVE OUTPUT</text>
    <text x="652" y="358" font-size="24" font-weight="900">A CANDIDATE YOU CAN READ, SEE, HEAR, RUN, OR EDIT</text>

    <rect x="652" y="402" width="248" height="92" fill="#ef2d8f" stroke="#172033" stroke-width="5"/>
    <rect x="930" y="402" width="248" height="92" fill="#fffdf5" stroke="#172033" stroke-width="5"/>
    <rect x="1208" y="402" width="296" height="92" fill="#6656d9" stroke="#172033" stroke-width="5"/>
    <rect x="652" y="530" width="248" height="92" fill="#8ff4d8" stroke="#172033" stroke-width="5"/>
    <rect x="930" y="530" width="248" height="92" fill="#fffdf5" stroke="#172033" stroke-width="5"/>
    <rect x="1208" y="530" width="296" height="92" fill="#f4dc67" stroke="#172033" stroke-width="5"/>

    <text x="776" y="460" text-anchor="middle" fill="#ffffff" font-size="27" font-weight="900">TEXT</text>
    <text x="1054" y="460" text-anchor="middle" font-size="27" font-weight="900">IMAGE</text>
    <text x="1356" y="460" text-anchor="middle" fill="#ffffff" font-size="27" font-weight="900">CODE</text>
    <text x="776" y="588" text-anchor="middle" font-size="27" font-weight="900">AUDIO</text>
    <text x="1054" y="588" text-anchor="middle" font-size="27" font-weight="900">VIDEO</text>
    <text x="1356" y="588" text-anchor="middle" font-size="27" font-weight="900">PLAN</text>
    <text x="652" y="666" font-size="22" font-weight="750">Most current generative systems use deep learning.</text>

    <rect x="64" y="734" width="1472" height="102" fill="#172033"/>
    <text x="96" y="776" fill="#ef2d8f" font-size="19" font-weight="900" letter-spacing="2">BUSINESS RULE</text>
    <text x="96" y="816" fill="#ffffff" font-size="24" font-weight="900">GENERATED OUTPUT IS A CANDIDATE, NOT PROOF.</text>
    <text x="930" y="816" fill="#ffffff" font-size="20" font-weight="750">It may be wrong, unsupported, unsafe, or unusable.</text>
  </g>
</svg>
