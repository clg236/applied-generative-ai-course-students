<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Machine learning learns patterns from examples</title>
  <desc id="desc">A full-slide pipeline showing examples passing through training into a model and then a prediction, inside the broader artificial-intelligence category.</desc>
  <rect width="1600" height="900" fill="#fffdf5"/>
  <rect x="10" y="10" width="1580" height="880" fill="none" stroke="#172033" stroke-width="12"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#172033">
    <text x="64" y="72" fill="#6656d9" font-size="22" font-weight="900" letter-spacing="3">WHAT IS AI? / 03</text>
    <text x="64" y="154" font-size="66" font-weight="900" letter-spacing="-2">MACHINE LEARNING</text>
    <text x="68" y="203" font-size="29" font-weight="700">One way to build AI: fit patterns from examples, then test on new cases.</text>

    <rect x="64" y="252" width="1472" height="496" fill="#eeeaff" stroke="#172033" stroke-width="8"/>
    <text x="94" y="294" fill="#6656d9" font-size="17" font-weight="900" letter-spacing="2">ARTIFICIAL INTELLIGENCE</text>
    <rect x="100" y="318" width="1400" height="390" fill="#8ff4d8" stroke="#172033" stroke-width="7"/>
    <text x="132" y="365" font-size="23" font-weight="900" letter-spacing="2">MACHINE LEARNING</text>

    <rect x="148" y="416" width="248" height="126" fill="#fffdf5" stroke="#172033" stroke-width="5"/>
    <rect x="500" y="416" width="248" height="126" fill="#fffdf5" stroke="#172033" stroke-width="5"/>
    <rect x="852" y="416" width="248" height="126" fill="#6656d9" stroke="#172033" stroke-width="5"/>
    <rect x="1204" y="416" width="248" height="126" fill="#ef2d8f" stroke="#172033" stroke-width="5"/>
    <text x="272" y="468" text-anchor="middle" font-size="21" font-weight="900">HISTORICAL</text>
    <text x="272" y="499" text-anchor="middle" font-size="21" font-weight="900">EXAMPLES</text>
    <text x="624" y="468" text-anchor="middle" font-size="21" font-weight="900">TRAINING</text>
    <text x="624" y="499" text-anchor="middle" font-size="21" font-weight="900">PROCESS</text>
    <text x="976" y="484" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="900">MODEL</text>
    <text x="1328" y="468" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="900">SCORE / LABEL</text>
    <text x="1328" y="499" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="900">FOR A NEW CASE</text>

    <path d="M408 479 H488" fill="none" stroke="#172033" stroke-width="8"/>
    <path d="M474 465 L496 479 L474 493" fill="none" stroke="#172033" stroke-width="8"/>
    <path d="M760 479 H840" fill="none" stroke="#172033" stroke-width="8"/>
    <path d="M826 465 L848 479 L826 493" fill="none" stroke="#172033" stroke-width="8"/>
    <path d="M1112 479 H1192" fill="none" stroke="#172033" stroke-width="8"/>
    <path d="M1178 465 L1200 479 L1178 493" fill="none" stroke="#172033" stroke-width="8"/>

    <text x="148" y="612" font-size="26" font-weight="900">EXAMPLE</text>
    <text x="308" y="612" font-size="25" font-weight="750">past transactions &#8594; fraud model &#8594; review score</text>
    <text x="148" y="660" font-size="22" font-weight="700">A useful model should work on cases it did not train on.</text>

    <rect x="64" y="788" width="1472" height="48" fill="#172033"/>
    <text x="800" y="821" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="900">THE MODEL LEARNS A PATTERN. PEOPLE REMAIN RESPONSIBLE FOR THE DECISION SYSTEM.</text>
  </g>
</svg>
