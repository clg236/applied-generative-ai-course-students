<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Artificial intelligence is a broad category</title>
  <desc id="desc">A full-slide diagram defining artificial intelligence through six jobs AI systems can perform: recognize, predict, recommend, plan, control, and generate.</desc>
  <rect width="1600" height="900" fill="#fffdf5"/>
  <rect x="10" y="10" width="1580" height="880" fill="none" stroke="#172033" stroke-width="12"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#172033">
    <text x="64" y="72" fill="#6656d9" font-size="22" font-weight="900" letter-spacing="3">WHAT IS AI? / 01</text>
    <text x="64" y="168" font-size="78" font-weight="900" letter-spacing="-3">ARTIFICIAL</text>
    <text x="64" y="248" font-size="78" font-weight="900" letter-spacing="-3">INTELLIGENCE</text>
    <text x="68" y="318" font-size="34" font-weight="700">A broad category, not a single product.</text>

    <rect x="64" y="386" width="620" height="250" fill="#f4dc67" stroke="#172033" stroke-width="8"/>
    <text x="94" y="438" font-size="20" font-weight="900" letter-spacing="2">WORKING DEFINITION</text>
    <text x="94" y="494" font-size="29" font-weight="750">Computer systems that perform tasks</text>
    <text x="94" y="534" font-size="29" font-weight="750">we associate with intelligence.</text>
    <line x1="94" y1="562" x2="654" y2="562" stroke="#172033" stroke-width="4"/>
    <text x="94" y="603" font-size="23" font-weight="700">The definition is practical, not a test of humanness.</text>

    <circle cx="1160" cy="400" r="330" fill="#6656d9" stroke="#172033" stroke-width="12"/>
    <text x="1160" y="132" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="900" letter-spacing="3">JOBS AI SYSTEMS</text>
    <text x="1160" y="162" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="900" letter-spacing="3">CAN PERFORM</text>

    <rect x="900" y="210" width="240" height="86" fill="#fffdf5" stroke="#172033" stroke-width="6"/>
    <rect x="1180" y="210" width="240" height="86" fill="#8ff4d8" stroke="#172033" stroke-width="6"/>
    <rect x="900" y="340" width="240" height="86" fill="#8ff4d8" stroke="#172033" stroke-width="6"/>
    <rect x="1180" y="340" width="240" height="86" fill="#fffdf5" stroke="#172033" stroke-width="6"/>
    <rect x="900" y="470" width="240" height="86" fill="#fffdf5" stroke="#172033" stroke-width="6"/>
    <rect x="1180" y="470" width="240" height="86" fill="#ef2d8f" stroke="#172033" stroke-width="6"/>

    <text x="1020" y="264" text-anchor="middle" font-size="27" font-weight="900">RECOGNIZE</text>
    <text x="1300" y="264" text-anchor="middle" font-size="27" font-weight="900">PREDICT</text>
    <text x="1020" y="394" text-anchor="middle" font-size="25" font-weight="900">RECOMMEND</text>
    <text x="1300" y="394" text-anchor="middle" font-size="27" font-weight="900">PLAN</text>
    <text x="1020" y="524" text-anchor="middle" font-size="27" font-weight="900">CONTROL</text>
    <text x="1300" y="524" text-anchor="middle" fill="#ffffff" font-size="27" font-weight="900">GENERATE</text>
    <text x="1160" y="632" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800">Different jobs can use different techniques.</text>

    <rect x="64" y="742" width="1472" height="94" fill="#172033"/>
    <text x="96" y="800" fill="#ffffff" font-size="27" font-weight="900">ASK:</text>
    <text x="184" y="800" fill="#ffffff" font-size="27" font-weight="750">WHAT DOES IT DO?  HOW DOES IT WORK?  WHAT HAPPENS AFTER THE OUTPUT?</text>
  </g>
</svg>
