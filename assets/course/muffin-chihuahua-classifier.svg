<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Muffin or chihuahua image-classification example</title>
  <desc id="desc">Six illustrated image tiles mix muffins and chihuahua faces. A three-step panel explains training on labeled examples, holding out examples, and testing on new images.</desc>
  <rect width="1600" height="720" fill="#fffdf5"/>
  <rect x="10" y="10" width="1580" height="700" fill="none" stroke="#172033" stroke-width="12"/>

  <defs>
    <g id="muffin">
      <path d="M28 88 H172 L152 176 H48 Z" fill="#d99b50" stroke="#172033" stroke-width="7"/>
      <path d="M24 94 C20 48 54 26 100 26 C146 26 180 48 176 94 Z" fill="#f4dc67" stroke="#172033" stroke-width="7"/>
      <circle cx="66" cy="62" r="13" fill="#433048"/>
      <circle cx="118" cy="52" r="11" fill="#433048"/>
      <circle cx="144" cy="78" r="12" fill="#433048"/>
    </g>
    <g id="dog">
      <path d="M42 50 L16 16 L68 28 Z" fill="#bd7c43" stroke="#172033" stroke-width="7"/>
      <path d="M158 50 L184 16 L132 28 Z" fill="#bd7c43" stroke="#172033" stroke-width="7"/>
      <ellipse cx="100" cy="94" rx="70" ry="72" fill="#d99b50" stroke="#172033" stroke-width="7"/>
      <circle cx="70" cy="82" r="13" fill="#172033"/>
      <circle cx="130" cy="82" r="13" fill="#172033"/>
      <ellipse cx="100" cy="116" rx="30" ry="24" fill="#fff0d2" stroke="#172033" stroke-width="5"/>
      <circle cx="100" cy="108" r="10" fill="#172033"/>
      <path d="M86 128 Q100 142 114 128" fill="none" stroke="#172033" stroke-width="5"/>
    </g>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif" fill="#172033">
    <text x="64" y="72" fill="#ef2d8f" font-size="22" font-weight="900" letter-spacing="3">DEEP LEARNING EXAMPLE</text>
    <text x="64" y="144" font-size="62" font-weight="900" letter-spacing="-2">MUFFIN OR CHIHUAHUA?</text>
    <text x="68" y="190" font-size="27" font-weight="700">Similar pixels can make a simple classification task surprisingly difficult.</text>

    <g transform="translate(76 236)">
      <rect x="0" y="0" width="250" height="208" fill="#eeeaff" stroke="#172033" stroke-width="6"/>
      <g transform="translate(25 10)"><use href="#muffin"/></g>
      <rect x="280" y="0" width="250" height="208" fill="#f7d7e7" stroke="#172033" stroke-width="6"/>
      <g transform="translate(305 10)"><use href="#dog"/></g>
      <rect x="560" y="0" width="250" height="208" fill="#d9fff4" stroke="#172033" stroke-width="6"/>
      <g transform="translate(585 10)"><use href="#muffin"/></g>

      <rect x="0" y="232" width="250" height="208" fill="#d9fff4" stroke="#172033" stroke-width="6"/>
      <g transform="translate(25 242)"><use href="#dog"/></g>
      <rect x="280" y="232" width="250" height="208" fill="#eeeaff" stroke="#172033" stroke-width="6"/>
      <g transform="translate(305 242)"><use href="#muffin"/></g>
      <rect x="560" y="232" width="250" height="208" fill="#f7d7e7" stroke="#172033" stroke-width="6"/>
      <g transform="translate(585 242)"><use href="#dog"/></g>
    </g>

    <rect x="944" y="236" width="592" height="440" fill="#f4dc67" stroke="#172033" stroke-width="8"/>
    <text x="980" y="288" font-size="20" font-weight="900" letter-spacing="2">THE EXPERIMENT</text>

    <rect x="980" y="320" width="520" height="82" fill="#fffdf5" stroke="#172033" stroke-width="5"/>
    <text x="1008" y="354" fill="#6656d9" font-size="18" font-weight="900">1 · TRAIN</text>
    <text x="1008" y="384" font-size="22" font-weight="750">Learn patterns from labeled examples.</text>

    <rect x="980" y="422" width="520" height="82" fill="#fffdf5" stroke="#172033" stroke-width="5"/>
    <text x="1008" y="456" fill="#6656d9" font-size="18" font-weight="900">2 · HOLD OUT</text>
    <text x="1008" y="486" font-size="22" font-weight="750">Keep some examples out of training.</text>

    <rect x="980" y="524" width="520" height="82" fill="#8ff4d8" stroke="#172033" stroke-width="5"/>
    <text x="1008" y="558" font-size="18" font-weight="900">3 · TEST</text>
    <text x="1008" y="588" font-size="22" font-weight="750">Measure performance on unseen images.</text>

    <text x="980" y="648" font-size="21" font-weight="900">A model can be confident and still be wrong.</text>
  </g>
</svg>
